name: libraria
description: "Bibliothèque personnelle numérique pour livres et audiobooks — recherche, téléchargement, lecture."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # i18n (Partie 7) — flutter gen-l10n génère AppLocalizations depuis lib/l10n/*.arb
  # (voir l10n.yaml). `intl` est requis directement : le code généré l'importe,
  # flutter_localizations seul ne suffit pas à le résoudre en dépendance directe.
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # État / DI — composition root unique dans main.dart (02_ARCHITECTURE.md)
  provider: ^6.1.2

  # Réseau
  dio: ^5.4.3+1

  # Stockage local
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3

# Lecteur EPUB — ADR-007 révisé : epub_view (rendu natif Flutter) abandonné
  # au profit de flutter_epub_viewer (WebView + epub.js) après avoir constaté
  # en test réel que epub_view.gotoEpubCfi() ne restaure le CFI qu'au niveau du
  # CHAPITRE, pas du paragraphe exact.
  flutter_epub_viewer: ^1.2.7

  # Lecteur audiobook — arrière-plan, lockscreen, multi-fichiers
  just_audio: ^0.9.40
  audio_service: ^0.18.15

  # Sécurité / intégrité
  crypto: ^3.0.3
  # Compression des couvertures 400×600/JPEG q85 (ADR-010) — pur Dart, pas de
  # canal de plateforme, faible risque de compatibilité.
  image: ^3.3.0
  archive: ^3.6.1              # décompression EPUB en flux — ZipBombGuard (03_SECURITE.md)
  flutter_secure_storage: ^9.2.2   # Keystore/DPAPI — jamais de credential en clair dans `settings`

  # Fichiers
  file_picker: ^8.0.6
  share_plus: 12.0.2            # budget R1'' du chapitre 12 — partage des exports/diagnostics

  # Identifiants / collections
  uuid: ^4.4.0
  collection: ^1.18.0

  # Notifications / TTS / tâches planifiées
  flutter_local_notifications: ^17.2.1
  flutter_tts: ^4.0.2
  workmanager: 0.9.0+3            # tâche périodique de vérification des fichiers locaux (09_TESTS_CI.md)

  # Statistiques
  fl_chart: ^0.68.0

  # Export tabulaire (chapitre 12, R1'' déjà justifié dans MES_PROPOSITIONS_LIBRARIA.md Partie 2)
  csv: ^6.0.0

  # Divers
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.0           # fallback « Ouvrir avec... » pour les EPUB trop complexes
  connectivity_plus: ^6.0.3      # ConnectivityService (lib/core/connectivity/)
  google_fonts: ^6.2.1           # Silkscreen / JetBrains Mono (08_UI_UX_DESIGN_SYSTEM.md)

  cupertino_icons: ^1.0.8

  # Permissions (Partie 0.5)
  permission_handler: ^12.0.3
  sqlite3: 2.3.0
  # [Correctif Windows] Etait en dev_dependencies (utilise a l'origine pour les
  # tests de migration en Dart pur) -- absent du build release, donc absent au
  # runtime desktop. sqflite (ci-dessus) ne supporte que Android/iOS ; sans
  # cette dependance ET son initialisation dans main() (databaseFactory =
  # databaseFactoryFfi), le tout premier await de main() (DatabaseHelper.database)
  # echoue silencieusement sur Windows, avant meme d'atteindre runApp().
  sqflite_common_ffi: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4               # HttpClient abstrait → MockHttpClient dans les tests (09_TESTS_CI.md)
  glados: ^1.1.7                # tests par propriétés — UrlValidator/FilenameSanitizer

flutter:
  uses-material-design: true
  generate: true # flutter gen-l10n — voir l10n.yaml et lib/l10n/*.arb
  # assets:
  #   - assets/icons/
  # fonts:
  #   déclarées via google_fonts (chargement dynamique) — pas de police embarquée en asset
  #   sauf DSEG7Classic optionnel, à ajouter ici si utilisée (08_UI_UX_DESIGN_SYSTEM.md)