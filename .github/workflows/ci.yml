name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.41.4' }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --coverage
      - uses: VeryGoodOpenSource/very_good_coverage@v3
        with: { path: coverage/lcov.info, min_coverage: 40 }

  golden-tests:
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.41.4' }
      - run: flutter pub get
      # Générer la baseline (`flutter test --update-goldens test/goldens`) AVANT le premier
      # run de ce job, sinon la comparaison échoue dès le départ (09_TESTS_CI.md).
      - run: flutter test test/goldens

  # Play Store Edition — sources étendues ABSENTES du binaire (ADR-014).
  # C'est ce build qui monte sur le Google Play Console.
  build-android-playstore:
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.41.4' }
      - run: flutter pub get
      # AGP a retiré le support de getDefaultProguardFile('proguard-android.txt') — Gradle évalue
      # ce fichier du plugin flutter_inappwebview_android (dernière version stable, 1.1.3) dès la
      # phase de configuration, donc même isMinifyEnabled=false ne suffit pas à l'éviter.
      # Voir https://github.com/pichillilorenzo/flutter_inappwebview/issues (proguard-android.txt).
      - name: Patch flutter_inappwebview_android build.gradle
        shell: bash
        run: |
          find "$HOME/.pub-cache" -path "*flutter_inappwebview_android*/android/build.gradle" -exec \
            sed -i "s/getDefaultProguardFile('proguard-android.txt')/getDefaultProguardFile('proguard-android-optimize.txt')/g" {} +
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-playstore-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  # GitHub Edition — sources étendues disponibles, OFF par défaut runtime.
  # C'est l'APK attaché aux GitHub Releases.
  build-android-github:
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.41.4' }
      - run: flutter pub get
      - name: Patch flutter_inappwebview_android build.gradle
        shell: bash
        run: |
          find "$HOME/.pub-cache" -path "*flutter_inappwebview_android*/android/build.gradle" -exec \
            sed -i "s/getDefaultProguardFile('proguard-android.txt')/getDefaultProguardFile('proguard-android-optimize.txt')/g" {} +
      - run: flutter build apk --release --dart-define=EXTENDED_SOURCES=true
      - uses: actions/upload-artifact@v4
        with:
          name: android-github-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.41.4' }
      - run: flutter pub get
      # Contournement d'une régression MSVC (VS 18.6, mai 2026) : le compilateur refuse
      # désormais les en-têtes <experimental/coroutine> encore utilisés par certains plugins
      # (flutter_inappwebview_windows, permission_handler_windows). CL est une variable
      # d'environnement lue nativement par cl.exe pour tout fichier compilé dans ce job.
      # Voir https://github.com/flutter/flutter/issues/186452
      - run: flutter build windows --release --dart-define=EXTENDED_SOURCES=true
        env:
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
      - name: Compresser le build Windows
        shell: pwsh
        run: |
          $releaseDir = (Get-ChildItem -Path build\windows -Recurse -Filter "*.exe" | Select-Object -First 1).DirectoryName
          Compress-Archive -Path "$releaseDir\*" -DestinationPath libraria-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: libraria-windows.zip
          if-no-files-found: error

  # Se déclenche uniquement sur un tag `v*` (ex. v0.1.0) — voir le trigger `on.push.tags` en haut du fichier.
  # Récupère les artefacts des deux jobs de build ci-dessus et publie la Release GitHub avec les fichiers attachés.
  publish-release:
    runs-on: ubuntu-latest
    needs: [build-android-github, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Lister les fichiers récupérés (debug)
        run: find artifacts -type f
      - uses: softprops/action-gh-release@v2
        with:
          name: "Libraria ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            artifacts/android-github-apk/app-release.apk
            artifacts/windows-zip/libraria-windows.zip